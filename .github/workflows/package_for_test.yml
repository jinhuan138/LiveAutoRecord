name: Package for Test

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    name: build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macOS-latest]
    env:
      # electron-builder 在 CI 机器上会因为 unpack ffmpeg-static 报错，参考了该修复方案：
      # https://github.com/electron-userland/electron-builder/issues/3179
      USE_HARD_LINKS: false

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm app:build -p never

      - name: Upload Dmg
        if: matrix.os == 'macOS-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Test Package Dmg
          path: apps/electron/build/**/*.dmg

      - name: Upload Exe
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Test Package Exe
          path: apps/electron/build/**/*.exe
